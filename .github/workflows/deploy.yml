name: Deploy Jekyll site to Pages

# Updated workflow with Ruby 3.3 compatibility
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive  # Pull submodules (teleworkability-index)
          
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Build marimo notebooks
        run: |
          echo "🔧 Building marimo notebooks..."
          python build_notebooks.py
          
          # Verify build output
          if [ ! -d "marimo_site" ]; then
            echo "❌ ERROR: marimo_site directory not created"
            exit 1
          fi
          
          # Count notebooks
          NOTEBOOK_COUNT=$(find marimo_site -name "*.html" -type f | wc -l)
          echo "✅ Built $NOTEBOOK_COUNT notebook HTML files"
          
          # Make copy script executable
          chmod +x copy_notebooks.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
        
      - name: Build with Jekyll
        run: |
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          
      - name: Verify marimo notebooks in _site
        run: |
          echo "📦 Verifying marimo notebooks..."
          
          # Check marimo index
          if [ ! -f "_site/marimo.html" ]; then
            echo "⚠️ WARNING: _site/marimo.html not found"
          else
            echo "✓ Found marimo index at _site/marimo.html"
          fi
          
          # Check notebook files
          NOTEBOOK_COUNT=$(find _site -path "*notebooks*.html" -type f | wc -l)
          if [ "$NOTEBOOK_COUNT" -eq 0 ]; then
            echo "⚠️ WARNING: No notebook HTML files found in _site"
          else
            echo "✓ Found $NOTEBOOK_COUNT notebook(s) in _site"
          fi
          
          # List all notebook locations for debugging
          echo "Notebook locations:"
          find _site -path "*notebooks*.html" -type f | head -10
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
