- id: teleworkability-index
  title: "Teleworkability Index"
  authors:
    - Mitchell Valdes-Bobes
    - Anna Lukianova
  year: 2025
  description: >
    A continuous, occupation-level index measuring the fraction of work 
    that can be performed remotely. Constructed using O*NET features and 
    ORS survey labels via two-stage Random Forest pipeline. Covers 873 
    SOC occupations with model performance: R² = 0.93, Correlation = 0.97.
    Stage 1 classifies zero/non-zero teleworkability (F1 = 0.96), Stage 2 
    predicts the teleworkability fraction for non-zero occupations (MAE = 0.046).
